[project]
name = "multi-agent-trading-bot"
version = "0.1.0"
description = "Multi-agent options trading research and ranking system (research only, no execution)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
llm = ["anthropic>=0.34"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "black>=24.3"]

[project.scripts]
matb = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is handled by the formatter.
# UP042: enums subclass (str, Enum) deliberately -- it is the shape Pydantic
#   v2 serialises most predictably and it keeps `.value` explicit at call sites.
# B008: Typer declares CLI options as call expressions in argument defaults;
#   that is the framework's documented interface, not an accident.
ignore = ["E501", "UP042", "B008"]

[tool.black]
line-length = 100
